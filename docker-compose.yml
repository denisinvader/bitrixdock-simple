services:
    php:
        build: ./php/${PHP_VERSION:-php82}
        volumes:
            - ${SITE_PATH:-./www}:/var/www/bitrix
            - ./logs/php:/var/log/php
        environment:
            TZ: ${TZ:-Europe/Moscow}
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
        tmpfs:
            - /tmp
        depends_on:
            db:
                condition: service_healthy

    nginx:
        build: ./nginx
        volumes:
            - ${SITE_PATH:-./www}:/var/www/bitrix
            - ./logs/nginx:/var/log/nginx
        ports:
            - ${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80
        environment:
            TZ: ${TZ:-Europe/Moscow}
        restart: unless-stopped
        depends_on:
            php:
                condition: service_healthy

    db:
        build:
            context: ./percona
            args:
                MYSQL_VERSION: ${MYSQL_VERSION:-8.4}
        volumes:
            - ./percona/init:/docker-entrypoint-initdb.d
            - ./logs/db:/var/log/mysql
            - db:/var/lib/mysql
        environment:
            MYSQL_DATABASE: ${MYSQL_DATABASE:-bitrix}
            MYSQL_USER: ${MYSQL_USER:-bitrix}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bitrix}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
            TZ: ${TZ:-Europe/Moscow}
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
            interval: 10s
            timeout: 5s
            retries: 30
            start_period: 30s

volumes:
    db:
